name: CPU validation
on:
  push:
    paths: ['code/**', 'docs/**', '.github/workflows/cpu-validation.yml']
  pull_request:
    paths: ['code/**', 'docs/**', '.github/workflows/cpu-validation.yml']
jobs:
  scientific-invariants:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.2.1 torchvision==0.17.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 timm==1.0.15
          python -m pip install -e . --no-deps
      - name: Validate source, configs and archived statistics
        run: python scripts/validate_release.py
      - name: Test adaptation and transformer invariants
        run: python -m unittest discover -s tests -v
      - name: Verify default ViT command selection
        run: bash scripts/run_vit.sh --dry-run
